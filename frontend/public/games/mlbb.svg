<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="mlbbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1945" />
      <stop offset="50%" stop-color="#142c6f" />
      <stop offset="100%" stop-color="#070c24" />
    </linearGradient>
    <linearGradient id="mlbbGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259" />
      <stop offset="50%" stop-color="#ffa751" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>
    <linearGradient id="mlbbWing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="50%" stop-color="#11998e" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Rounded Rect -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#mlbbBg)" stroke="#3b82f6" stroke-width="2.5" stroke-opacity="0.4" />
  
  <!-- Outer Glow Circle -->
  <circle cx="60" cy="54" r="38" fill="#1e3a8a" fill-opacity="0.3" filter="url(#glow)" />

  <!-- Crown / Wings -->
  <path d="M60 22 L72 38 L90 32 L82 54 L94 68 L60 84 L26 68 L38 54 L30 32 L48 38 Z" fill="url(#mlbbGold)" filter="url(#glow)" />
  
  <!-- Inner Diamond -->
  <polygon points="60,34 76,52 60,70 44,52" fill="#ffffff" fill-opacity="0.9" />
  <polygon points="60,38 72,52 60,66 48,52" fill="#0284c7" />
  <polygon points="60,42 68,52 60,62 52,52" fill="#38bdf8" />

  <!-- MLBB Banner at Bottom -->
  <rect x="22" y="86" width="76" height="18" rx="9" fill="#0f172a" stroke="url(#mlbbGold)" stroke-width="1.5" />
  <text x="60" y="99" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="10" fill="#fbbf24" text-anchor="middle" letter-spacing="1.5">MLBB</text>
</svg>
