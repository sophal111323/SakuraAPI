<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="rbxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="rbxSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#e4e4e7" />
      <stop offset="100%" stop-color="#a1a1aa" />
    </linearGradient>
    <filter id="rbxGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#rbxBg)" stroke="#e11d48" stroke-width="2.5" stroke-opacity="0.5" />

  <circle cx="60" cy="52" r="34" fill="#e11d48" fill-opacity="0.15" filter="url(#rbxGlow)" />

  <!-- Tilted Roblox Cube -->
  <g transform="translate(60, 52) rotate(-15) translate(-60, -52)">
    <rect x="42" y="34" width="36" height="36" rx="7" fill="url(#rbxSilver)" filter="url(#rbxGlow)" />
    <!-- Inner Cutout -->
    <rect x="52" y="44" width="16" height="16" rx="3.5" fill="#09090b" />
  </g>

  <!-- Badge -->
  <rect x="18" y="86" width="84" height="18" rx="9" fill="#09090b" stroke="#e11d48" stroke-width="1.5" />
  <text x="60" y="99" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="9" fill="#fecdd3" text-anchor="middle" letter-spacing="1.5">ROBLOX</text>
</svg>
