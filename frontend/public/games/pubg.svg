<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="pubgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#292524" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="pubgYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="pubgHelmet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#44403c" />
      <stop offset="50%" stop-color="#292524" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    <filter id="pubgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#pubgBg)" stroke="#facc15" stroke-width="2.5" stroke-opacity="0.45" />

  <!-- Warm Combat Halo -->
  <circle cx="60" cy="50" r="34" fill="#facc15" fill-opacity="0.15" filter="url(#pubgGlow)" />

  <!-- Level 3 Helmet Shape -->
  <path d="M38 46 C38 30 50 22 60 22 C70 22 82 30 82 46 C82 54 80 64 78 72 L42 72 C40 64 38 54 38 46 Z" fill="url(#pubgHelmet)" stroke="#78716c" stroke-width="2" />
  
  <!-- Visor Slit (Spetsnaz Mask) -->
  <rect x="42" y="44" width="36" height="12" rx="3" fill="#09090b" stroke="#facc15" stroke-width="1.8" />
  <!-- Eye Glow in Visor -->
  <line x1="46" y1="50" x2="74" y2="50" stroke="#fef08a" stroke-width="2" stroke-linecap="round" filter="url(#pubgGlow)" />
  
  <!-- Rivets and Helmet Rim -->
  <circle cx="43" cy="38" r="2" fill="#a8a29e" />
  <circle cx="77" cy="38" r="2" fill="#a8a29e" />
  <path d="M40 64 L80 64" stroke="#57534e" stroke-width="2.5" />

  <!-- PUBG MOBILE Badge -->
  <rect x="18" y="86" width="84" height="18" rx="9" fill="#0c0a09" stroke="url(#pubgYellow)" stroke-width="1.5" />
  <text x="60" y="99" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="9" fill="#facc15" text-anchor="middle" letter-spacing="1">PUBG MOBILE</text>
</svg>
